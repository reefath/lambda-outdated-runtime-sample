# APIs that were removed: each must move before the cluster can go past the version noted.
---
# Removed in 1.25 (PodSecurityPolicy has no replacement API: use Pod Security Admission labels).
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: reporting-restricted
spec:
  privileged: false
  runAsUser: { rule: MustRunAsNonRoot }
  seLinux: { rule: RunAsAny }
  supplementalGroups: { rule: RunAsAny }
  fsGroup: { rule: RunAsAny }
  volumes: ["configMap", "secret", "emptyDir"]
---
# batch/v1beta1 CronJob removed in 1.25: use batch/v1.
apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: nightly-report
  namespace: reporting
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: public.ecr.aws/docker/library/python:3.13-slim
              command: ["python", "-m", "report"]
---
# policy/v1beta1 PodDisruptionBudget removed in 1.25: use policy/v1.
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: report-api
  namespace: reporting
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: report-api }
---
# autoscaling/v2beta2 removed in 1.26: use autoscaling/v2.
apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: report-api
  namespace: reporting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: report-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
